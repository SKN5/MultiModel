<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="MultiModel — a clean multi-model AI chat workspace powered by Puter.js">
<title>MultiModel</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
<style>
:root{
  --bg:#08090c;--panel:#0e1117;--panel2:#151922;--panel3:#1b202b;--border:#252b36;
  --text:#f5f7fb;--muted:#8992a2;--accent:#7c5cff;--accent2:#9a84ff;
  --user:#181d27;--assistant:#0d1015;--danger:#ff6978;--ok:#65d69a;
  --shadow:0 24px 80px rgba(0,0,0,.38)
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.app{height:100vh;display:grid;grid-template-columns:290px minmax(0,1fr)}
.sidebar{background:rgba(11,13,18,.94);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:15px;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:5px 5px 17px}
.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#7c5cff,#4f9cff);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 30px #7c5cff30}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.03em}.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
.new-chat{width:100%;border:1px solid #343b48;background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:9px;font-weight:650;transition:.15s}
.new-chat:hover{background:var(--panel3);border-color:#485162}
.plus{font-size:18px;line-height:1}
.side-search{position:relative;margin:13px 0 11px}
.side-search input{width:100%;background:#0a0d12;border:1px solid var(--border);color:var(--text);outline:none;border-radius:10px;padding:9px 10px 9px 34px;font-size:12px}
.side-search input:focus{border-color:#4a416f}
.side-search span{position:absolute;left:11px;top:8px;color:var(--muted);font-size:13px}
.section-label{font-size:10px;color:#687181;text-transform:uppercase;letter-spacing:.13em;padding:3px 5px 7px}
.chat-list{flex:1;overflow:auto;min-height:0;padding-right:2px}
.chat-item{display:flex;align-items:center;gap:5px;border-radius:10px;margin:2px 0;color:#c9ced7;min-width:0}
.chat-item.active{background:#1a1f29;color:#fff}
.chat-main{min-width:0;flex:1;border:0;background:transparent;color:inherit;text-align:left;padding:10px 9px;overflow:hidden}
.chat-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:9px;color:#697180;margin-top:3px}
.chat-menu{border:0;background:transparent;color:#687181;padding:7px;margin-right:3px;border-radius:7px}
.chat-menu:hover{background:#252b35;color:#fff}
.empty-history{padding:18px 8px;color:#687181;font-size:12px;line-height:1.55;text-align:center}
.sidebar-bottom{padding-top:10px;border-top:1px solid var(--border);margin-top:10px}
.status-card{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:7px;padding:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#5b6370}.dot.ok{background:var(--ok);box-shadow:0 0 10px #65d69a80}.dot.bad{background:var(--danger)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.topbar{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:rgba(9,11,15,.84);backdrop-filter:blur(18px);z-index:5}
.mobile-menu{display:none}
.model-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.model-select{width:min(410px,40vw);background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 34px 9px 11px;outline:none;font-size:12px}
.model-select:focus{border-color:#4d4277}
.provider-badge{font-size:10px;color:var(--muted);padding:5px 8px;border:1px solid var(--border);border-radius:999px;white-space:nowrap}
.top-spacer{flex:1}
.icon-btn,.top-btn{border:1px solid var(--border);background:var(--panel2);color:#cbd1db;border-radius:9px;height:34px;padding:0 10px;font-size:12px}
.icon-btn{width:34px;padding:0;font-size:15px}
.icon-btn:hover,.top-btn:hover{background:var(--panel3);color:#fff}
.status{font-size:10px;color:var(--muted);white-space:nowrap}
.scroll{flex:1;overflow:auto;min-height:0}
.content{width:min(920px,100%);margin:auto;padding:26px 22px 170px}
.welcome{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:45px 10px}
.welcome-orb{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#7c5cff,#4f9cff);display:grid;place-items:center;font-size:24px;font-weight:900;box-shadow:0 15px 60px #7c5cff35;margin-bottom:19px}
.welcome h1{font-size:34px;letter-spacing:-.05em;margin:0 0 9px}
.welcome p{color:var(--muted);font-size:13px;max-width:560px;line-height:1.65;margin:0}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(650px,100%);margin-top:25px}
.quick{border:1px solid var(--border);background:#0e1218;border-radius:12px;color:#cdd2dc;text-align:left;padding:12px;font-size:12px;transition:.15s}
.quick:hover{background:#171c25;border-color:#3b4351;transform:translateY(-1px)}
.quick b{display:block;color:#f3f5f8;margin-bottom:3px}
.message{display:flex;gap:12px;margin:0 0 25px;align-items:flex-start}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.avatar.user{background:#2a303b}.avatar.ai{background:linear-gradient(135deg,#7c5cff,#4f9cff)}
.bubble{min-width:0;flex:1}.roleline{font-size:10px;color:#737c8a;margin:2px 0 6px}
.user-text{white-space:pre-wrap;line-height:1.6;font-size:14px}
.ai-content{font-size:14px;line-height:1.68;color:#e6e9ef;overflow-wrap:anywhere}
.ai-content p{margin:0 0 12px}.ai-content p:last-child{margin-bottom:0}
.ai-content h1,.ai-content h2,.ai-content h3{letter-spacing:-.02em;margin:20px 0 9px}
.ai-content h1{font-size:22px}.ai-content h2{font-size:18px}.ai-content h3{font-size:15px}
.ai-content ul,.ai-content ol{padding-left:22px}.ai-content li{margin:4px 0}
.ai-content blockquote{border-left:3px solid #4c5360;margin:12px 0;padding:2px 14px;color:#aab1bd}
.ai-content a{color:#a99aff}
.ai-content table{border-collapse:collapse;width:100%;margin:14px 0;font-size:12px}
.ai-content th,.ai-content td{border:1px solid var(--border);padding:7px;text-align:left}.ai-content th{background:#151a22}
.code-wrap{position:relative;margin:13px 0;border:1px solid #2a313d;border-radius:10px;overflow:hidden;background:#0b0e13}
.code-head{display:flex;align-items:center;justify-content:space-between;background:#141820;border-bottom:1px solid #272e39;padding:6px 9px;font-size:10px;color:#7e8795}
.copy-code{border:1px solid #303744;background:#1a2029;color:#bdc4cf;border-radius:6px;padding:4px 7px;font-size:10px}
.copy-code:hover{color:#fff;background:#222a35}
.ai-content pre{margin:0;overflow:auto;padding:13px;font-size:12px;line-height:1.55}
.ai-content code:not(pre code){background:#1a2029;border:1px solid #2a313c;border-radius:5px;padding:1px 5px;font-size:.9em}
.message-actions{display:flex;gap:5px;margin-top:8px}
.message-actions button{border:0;background:transparent;color:#697382;font-size:10px;padding:4px 5px;border-radius:6px}
.message-actions button:hover{background:#171c24;color:#cdd3dd}
.generating{display:flex;align-items:center;gap:8px;color:#7d8795;font-size:12px}
.thinking{display:flex;gap:4px}.thinking i{width:5px;height:5px;border-radius:50%;background:#8791a0;animation:pulse 1s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.image-result{margin-top:11px;border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#0b0e13;max-width:650px}
.image-result img{display:block;width:100%;max-height:650px;object-fit:contain;background:#08090c}
.image-caption{padding:9px 11px;font-size:11px;color:var(--muted)}
.composer-area{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 20px;background:linear-gradient(transparent,rgba(8,9,12,.97) 28%);pointer-events:none}
.composer{pointer-events:auto;width:min(900px,100%);margin:auto;border:1px solid #303745;background:rgba(17,20,27,.96);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}
.composer-tools{display:flex;align-items:center;gap:7px;padding:8px 9px 0}
.tool{border:0;background:transparent;color:#7e8795;border-radius:7px;padding:5px 7px;font-size:11px}.tool:hover{background:#202631;color:#d8dde6}
.tool.active{color:#b8adff;background:#27213e}
.attachment{font-size:10px;color:#a7aeba;display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.attachment span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer-row{display:flex;align-items:flex-end;gap:8px;padding:8px 9px 9px}
.prompt{flex:1;min-height:46px;max-height:190px;resize:none;border:0;outline:none;background:transparent;color:var(--text);font-size:14px;line-height:1.5;padding:7px 5px}
.prompt::placeholder{color:#626b79}
.send{width:39px;height:39px;border:0;background:#f2f3f5;color:#11141a;border-radius:11px;font-weight:800}
.send:hover{background:#fff}.send.stop{background:#ff6978;color:white}
.composer-note{text-align:center;color:#5f6875;font-size:9px;padding:0 10px 8px}
.overlay{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.open{display:flex}
.modal{width:min(720px,100%);max-height:min(720px,90vh);overflow:auto;background:#10141b;border:1px solid #303744;border-radius:16px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:15px;margin:0}.modal-close{margin-left:auto;border:0;background:transparent;color:#7f8897;font-size:20px}
.modal-body{padding:16px}.search-result{padding:11px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;background:#0c1016;cursor:pointer}.search-result:hover{border-color:#444d5b}.search-result b{font-size:12px}.search-result p{font-size:11px;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-input{width:100%;border:1px solid var(--border);background:#0b0e13;color:#fff;border-radius:9px;padding:10px;outline:none}
.image-modal-grid{display:grid;gap:11px}.image-modal-grid textarea{min-height:110px;resize:vertical;border:1px solid var(--border);background:#0b0e13;color:#fff;border-radius:10px;padding:10px;outline:none}.primary{border:0;background:linear-gradient(135deg,#7c5cff,#6650e8);color:white;border-radius:9px;padding:10px 13px;font-weight:700}.primary:hover{filter:brightness(1.08)}.result-note{font-size:11px;color:var(--muted);line-height:1.5}
.toast{position:fixed;right:18px;bottom:18px;background:#171c24;border:1px solid #343c49;color:#e8ebf0;border-radius:10px;padding:10px 13px;font-size:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:none}
.hidden{display:none!important}
@media(max-width:800px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:40;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile-menu{display:block}.model-select{width:min(48vw,300px)}.provider-badge,.status{display:none}.content{padding-left:14px;padding-right:14px}.welcome h1{font-size:28px}.quick-grid{grid-template-columns:1fr}.composer-area{padding-left:10px;padding-right:10px}.topbar{padding:0 10px}
}
@media(max-width:500px){.top-btn{display:none}.model-select{width:46vw;font-size:11px}.message{gap:8px}.avatar{width:27px;height:27px;flex-basis:27px}.ai-content,.user-text{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">M</div><div><div class="brand-name">MultiModel</div><div class="brand-sub">AI workspace</div></div></div>
    <button class="new-chat" id="newChat"><span class="plus">＋</span> New chat</button>
    <div class="side-search"><span>⌕</span><input id="historySearch" placeholder="Search chats…" autocomplete="off"></div>
    <div class="section-label">History</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-bottom"><div class="status-card"><span class="dot" id="puterDot"></span><span id="puterStatus">Connecting to Puter…</span></div></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="model-wrap">
        <select class="model-select" id="modelSelect"><option value="">Loading models…</option></select>
        <span class="provider-badge" id="providerBadge">Puter</span>
      </div>
      <span class="status" id="status">Starting…</span>
      <div class="top-spacer"></div>
      <button class="top-btn" id="imageBtn">✦ Image</button>
      <button class="icon-btn" id="searchBtn" title="Search chats">⌕</button>
    </header>

    <div class="scroll" id="scroll">
      <section class="content" id="content"></section>
    </div>

    <div class="composer-area">
      <div class="composer">
        <div class="composer-tools">
          <button class="tool" id="attachBtn">＋ File</button>
          <button class="tool" id="clearBtn">Clear</button>
          <div class="attachment" id="attachment"><span></span></div>
        </div>
        <div class="composer-row">
          <textarea class="prompt" id="prompt" rows="1" placeholder="Message your selected model…"></textarea>
          <button class="send" id="sendBtn" aria-label="Send">↑</button>
        </div>
        <div class="composer-note">MultiModel uses Puter.js. AI usage is handled by Puter.</div>
      </div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" class="hidden" multiple>
<div class="overlay" id="searchOverlay">
  <div class="modal">
    <div class="modal-head"><h2>Search conversations</h2><button class="modal-close" data-close="searchOverlay">×</button></div>
    <div class="modal-body"><input class="modal-input" id="globalSearch" placeholder="Search messages…"><div id="searchResults" style="margin-top:12px"></div></div>
  </div>
</div>

<div class="overlay" id="imageOverlay">
  <div class="modal">
    <div class="modal-head"><h2>Generate image</h2><button class="modal-close" data-close="imageOverlay">×</button></div>
    <div class="modal-body">
      <div class="image-modal-grid">
        <textarea id="imagePrompt" placeholder="Describe the image you want…"></textarea>
        <div style="display:flex;gap:8px;align-items:center"><button class="primary" id="generateImage">Generate</button><span class="result-note" id="imageStatus">Puter image generation</span></div>
        <div id="imagePreview"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="renameOverlay">
  <div class="modal" style="max-width:440px">
    <div class="modal-head"><h2>Rename chat</h2><button class="modal-close" data-close="renameOverlay">×</button></div>
    <div class="modal-body"><input class="modal-input" id="renameInput" maxlength="100"><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="primary" id="renameSave">Save</button></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const KEY="mm-v3-chats";
const MODEL_KEY="mm-v3-model";
const state={chats:[],currentId:null,models:[],selectedModel:"",file:null,renamingId:null,busy:false};

function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function now(){return Date.now()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),2400)}
function save(){localStorage.setItem(KEY,JSON.stringify(state.chats))}
function load(){
  try{state.chats=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{state.chats=[]}
  if(!Array.isArray(state.chats))state.chats=[];
  const saved=localStorage.getItem(MODEL_KEY);if(saved)state.selectedModel=saved;
  if(!state.chats.length)createChat(false);
  else state.currentId=state.chats[0].id;
}
function current(){return state.chats.find(c=>c.id===state.currentId)||null}
function createChat(render=true){
  const c={id:uid(),title:"New chat",created:now(),updated:now(),model:state.selectedModel,messages:[]};
  state.chats.unshift(c);state.currentId=c.id;save();
  if(render){renderChats();render()}
  return c;
}
function selectChat(id){if(!state.chats.some(c=>c.id===id))return;state.currentId=id;const c=current();if(c?.model){state.selectedModel=c.model;$("modelSelect").value=c.model}renderChats();render();$("sidebar").classList.remove("open")}
function deleteChat(id){
  const i=state.chats.findIndex(c=>c.id===id);if(i<0)return;
  state.chats.splice(i,1);if(!state.chats.length)createChat(false);
  if(!state.chats.some(c=>c.id===state.currentId))state.currentId=state.chats[0].id;
  save();renderChats();render();
}
function renameChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;state.renamingId=id;$("renameInput").value=c.title;$("renameOverlay").classList.add("open");setTimeout(()=>$("renameInput").select(),30)}
function saveRename(){const c=state.chats.find(x=>x.id===state.renamingId);if(!c)return;c.title=$("renameInput").value.trim()||"New chat";c.updated=now();save();$("renameOverlay").classList.remove("open");renderChats();render()}
function titleFrom(text){const t=text.replace(/\s+/g," ").trim();return t.length>46?t.slice(0,46)+"…":t||"New chat"}
function timeLabel(ts){const d=new Date(ts),today=new Date();if(d.toDateString()===today.toDateString())return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});return d.toLocaleDateString([],{month:"short",day:"numeric"})}
function renderChats(){
  const q=$("historySearch").value.trim().toLowerCase();
  const list=$("chatList");list.innerHTML="";
  const arr=state.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.messages.some(m=>String(m.text||"").toLowerCase().includes(q)));
  if(!arr.length){list.innerHTML='<div class="empty-history">No matching conversations.</div>';return}
  arr.sort((a,b)=>b.updated-a.updated).forEach(c=>{
    const row=document.createElement("div");row.className="chat-item"+(c.id===state.currentId?" active":"");
    row.innerHTML='<button class="chat-main"><div class="chat-title">'+esc(c.title)+'</div><div class="chat-time">'+timeLabel(c.updated)+'</div></button><button class="chat-menu" title="Chat options">⋯</button>';
    row.querySelector(".chat-main").onclick=()=>selectChat(c.id);
    row.querySelector(".chat-menu").onclick=e=>{e.stopPropagation();const action=prompt("Type rename or delete");if(action==="rename")renameChat(c.id);else if(action==="delete")deleteChat(c.id)};
    list.appendChild(row);
  });
}
function normalizeContent(content){
  if(typeof content==="string")return content;
  if(Array.isArray(content))return content.map(x=>typeof x==="string"?x:(x?.text||x?.content||"")).join("");
  return content?.text||content?.content||"";
}
function renderMarkdown(text){
  const raw=marked.parse(text||"",{breaks:true,gfm:true});
  const safe=DOMPurify.sanitize(raw,{ADD_ATTR:["target"]});
  const box=document.createElement("div");box.innerHTML=safe;
  box.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});
  box.querySelectorAll("pre code").forEach(code=>{
    try{hljs.highlightElement(code)}catch{}
    const pre=code.parentElement,wrap=document.createElement("div");wrap.className="code-wrap";
    const head=document.createElement("div");head.className="code-head";
    const lang=(code.className.match(/language-([^\s]+)/)||[])[1]||"code";
    head.innerHTML="<span>"+esc(lang)+"</span><button class='copy-code'>Copy</button>";
    head.querySelector("button").onclick=async()=>{await navigator.clipboard.writeText(code.innerText);toast("Code copied")};
    pre.parentNode.insertBefore(wrap,pre);wrap.append(head,pre);
  });
  return box.innerHTML;
}
function render(){
  const c=current(),content=$("content");
  if(!c||!c.messages.length){
    content.innerHTML='<div class="welcome"><div class="welcome-orb">M</div><h1>What do you want to build?</h1><p>Chat with different AI models from one clean workspace. Your conversations stay in this browser.</p><div class="quick-grid"><button class="quick" data-prompt="Explain this concept like I am a beginner."><b>Learn something</b>Get a simple explanation</button><button class="quick" data-prompt="Help me plan and build this project step by step."><b>Build a project</b>Turn an idea into a plan</button><button class="quick" data-prompt="Review this code and explain how to improve it."><b>Review code</b>Find bugs and improvements</button><button class="quick" data-prompt="Give me five creative ideas for this topic."><b>Brainstorm</b>Explore new ideas</button></div></div>';
    content.querySelectorAll(".quick").forEach(b=>b.onclick=()=>{$("prompt").value=b.dataset.prompt;autoGrow();$("prompt").focus()});
    return;
  }
  content.innerHTML="";
  c.messages.forEach((m,i)=>{
    const row=document.createElement("div");row.className="message";
    const isUser=m.role==="user";
    row.innerHTML='<div class="avatar '+(isUser?"user":"ai")+'">'+(isUser?"You":"M")+'</div><div class="bubble"><div class="roleline">'+(isUser?"You":"Assistant")+'</div><div class="'+(isUser?"user-text":"ai-content")+'"></div><div class="message-actions"></div></div>';
    const body=row.querySelector(".user-text,.ai-content");
    if(isUser)body.textContent=m.text||"";
    else body.innerHTML=renderMarkdown(m.text||"");
    if(m.imageUrl){const box=document.createElement("div");box.className="image-result";box.innerHTML='<img src="'+esc(m.imageUrl)+'" alt="Generated image"><div class="image-caption">'+esc(m.imagePrompt||"Generated image")+'</div>';body.appendChild(box)}
    const actions=row.querySelector(".message-actions");
    const copy=document.createElement("button");copy.textContent="Copy";copy.onclick=async()=>{await navigator.clipboard.writeText(m.text||"");toast("Copied")};actions.appendChild(copy);
    if(!isUser){const regen=document.createElement("button");regen.textContent="Regenerate";regen.onclick=()=>regenerate(i);actions.appendChild(regen)}
    content.appendChild(row);
  });
  requestAnimationFrame(()=>{$("scroll").scrollTop=$("scroll").scrollHeight});
}
function autoGrow(){const p=$("prompt");p.style.height="auto";p.style.height=Math.min(p.scrollHeight,190)+"px"}
function setStatus(text,kind=""){
  $("status").textContent=text;$("puterStatus").textContent=text;
  $("puterDot").className="dot "+(kind==="ok"?"ok":kind==="bad"?"bad":"");
}
function modelLabel(m){return m.name||m.id||"Unknown model"}
function renderModels(){
  const sel=$("modelSelect"),previous=state.selectedModel;
  sel.innerHTML="";
  if(!state.models.length){sel.innerHTML='<option value="">No models available</option>';return}
  const groups={};
  state.models.forEach(m=>(groups[m.provider||"Other"]??=[]).push(m));
  Object.entries(groups).sort().forEach(([provider,models])=>{
    const og=document.createElement("optgroup");og.label=provider;
    models.sort((a,b)=>modelLabel(a).localeCompare(modelLabel(b))).forEach(m=>{const o=document.createElement("option");o.value=m.id;o.textContent=modelLabel(m);og.appendChild(o)});
    sel.appendChild(og);
  });
  const valid=state.models.some(m=>m.id===previous);
  state.selectedModel=valid?previous:state.models[0].id;
  sel.value=state.selectedModel;localStorage.setItem(MODEL_KEY,state.selectedModel);
  const m=state.models.find(x=>x.id===state.selectedModel);$("providerBadge").textContent=m?.provider||"Puter";
  const c=current();if(c&&!c.messages.length){c.model=state.selectedModel;save()}
}
async function loadModels(){
  setStatus("Loading models…");
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("Model catalog timed out after 15 seconds")),15000));
    const models=await Promise.race([puter.ai.listModels(),timeout]);
    if(!Array.isArray(models)||!models.length)throw new Error("Puter returned no models");
    state.models=models;renderModels();setStatus(models.length+" models","ok");
  }catch(e){
    console.error(e);state.models=[];renderModels();setStatus("Models unavailable","bad");toast("Could not load Puter models. Retry the page.");
  }
}
function errorText(e){return e?.message||e?.msg||String(e)}
async function send(){
  if(state.busy)return;
  const prompt=$("prompt").value.trim();if(!prompt)return;
  if(!state.selectedModel){toast("Select a model first");return}
  let c=current();if(!c)c=createChat(false);
  const user={role:"user",text:prompt,time:now()};
  c.messages.push(user);if(c.title==="New chat")c.title=titleFrom(prompt);c.model=state.selectedModel;c.updated=now();save();
  $("prompt").value="";autoGrow();state.busy=true;$("sendBtn").classList.add("stop");$("sendBtn").textContent="■";render();
  const placeholder={role:"assistant",text:"",time:now(),pending:true};c.messages.push(placeholder);render();
  try{
    const messages=c.messages.filter(m=>!m.pending).map(m=>({role:m.role,content:m.text}));
    const result=await puter.ai.chat(messages,{model:state.selectedModel,stream:true,normalize:true});
    let full="";
    if(result&&result[Symbol.asyncIterator]){
      for await(const chunk of result){
        const piece=normalizeContent(chunk?.text??chunk?.message?.content??chunk?.content??"");
        if(piece){full+=piece;placeholder.text=full;render()}
      }
    }else full=normalizeContent(result?.message?.content??result?.text??result);
    placeholder.text=full||"The model returned an empty response.";
  }catch(e){placeholder.text="**Error:** "+errorText(e);toast("AI request failed")}
  finally{delete placeholder.pending;c.updated=now();save();state.busy=false;$("sendBtn").classList.remove("stop");$("sendBtn").textContent="↑";render();renderChats()}
}
async function regenerate(index){
  if(state.busy)return;const c=current();if(!c)return;
  const target=c.messages[index];if(!target||target.role!=="assistant")return;
  let start=index-1;while(start>=0&&c.messages[start].role!=="user")start--;
  if(start<0)return;
  c.messages.splice(index,1);save();render();
  const original=$("prompt").value;$("prompt").value=c.messages[start].text;
  const fake= c.messages.splice(start+1,0,{role:"user",text:c.messages[start].text,time:now(),regenerated:true});
  // Remove the temporary duplicate before sending through the normal request path.
  c.messages.splice(start+1,1);$("prompt").value="";state.busy=true;$("sendBtn").classList.add("stop");$("sendBtn").textContent="■";
  const placeholder={role:"assistant",text:"",time:now(),pending:true};c.messages.push(placeholder);render();
  try{
    const messages=c.messages.slice(0,-1).filter(m=>!m.pending).map(m=>({role:m.role,content:m.text}));
    const result=await puter.ai.chat(messages,{model:c.model||state.selectedModel,stream:true,normalize:true});
    let full="";if(result&&result[Symbol.asyncIterator])for await(const chunk of result){const piece=normalizeContent(chunk?.text??chunk?.message?.content??chunk?.content??"");if(piece){full+=piece;placeholder.text=full;render()}}else full=normalizeContent(result?.message?.content??result?.text??result);
    placeholder.text=full||"The model returned an empty response.";
  }catch(e){placeholder.text="**Error:** "+errorText(e)}
  finally{delete placeholder.pending;c.updated=now();save();state.busy=false;$("sendBtn").classList.remove("stop");$("sendBtn").textContent="↑";render();renderChats()}
}
async function generateImage(){
  const p=$("imagePrompt").value.trim();if(!p)return toast("Describe the image first");
  $("generateImage").disabled=true;$("imageStatus").textContent="Generating…";$("imagePreview").innerHTML="";
  try{
    const result=await puter.ai.txt2img(p);
    const url=result?.url||result?.image_url||result?.src||result;
    if(!url)throw new Error("Puter returned no image URL");
    const c=current();c.messages.push({role:"assistant",text:"Generated an image.",imageUrl:url,imagePrompt:p,time:now()});c.updated=now();save();$("imageOverlay").classList.remove("open");render();renderChats();
  }catch(e){$("imageStatus").textContent=errorText(e);toast("Image generation failed")}
  finally{$("generateImage").disabled=false}
}
function runSearch(q){
  const out=$("searchResults");q=q.trim().toLowerCase();out.innerHTML="";
  if(!q){out.innerHTML='<div class="result-note">Type something to search your saved conversations.</div>';return}
  const hits=[];
  state.chats.forEach(c=>c.messages.forEach(m=>{if(String(m.text||"").toLowerCase().includes(q))hits.push({c,m})}));
  if(!hits.length){out.innerHTML='<div class="result-note">No matches found.</div>';return}
  hits.slice(0,30).forEach(({c,m})=>{const el=document.createElement("div");el.className="search-result";el.innerHTML="<b>"+esc(c.title)+"</b><p>"+esc(m.text||"Generated image")+"</p>";el.onclick=()=>{$("searchOverlay").classList.remove("open");selectChat(c.id)};out.appendChild(el)})
}
$("newChat").onclick=()=>createChat();
$("historySearch").oninput=renderChats;
$("modelSelect").onchange=e=>{state.selectedModel=e.target.value;localStorage.setItem(MODEL_KEY,state.selectedModel);const c=current();if(c){c.model=state.selectedModel;c.updated=now();save()}const m=state.models.find(x=>x.id===state.selectedModel);$("providerBadge").textContent=m?.provider||"Puter"};
$("sendBtn").onclick=send;
$("prompt").addEventListener("input",autoGrow);
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("attachBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{state.file=e.target.files?.[0]||null;$("attachment").querySelector("span").textContent=state.file?state.file.name:"";if(state.file)toast("File selected — add its contents to your prompt if needed.")};
$("clearBtn").onclick=()=>{state.file=null;$("fileInput").value="";$("attachment").querySelector("span").textContent=""};
$("imageBtn").onclick=()=>{$("imageOverlay").classList.add("open");$("imagePrompt").focus()};
$("generateImage").onclick=generateImage;
$("searchBtn").onclick=()=>{$("searchOverlay").classList.add("open");$("globalSearch").focus();runSearch($("globalSearch").value)};
$("globalSearch").oninput=e=>runSearch(e.target.value);
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
document.querySelectorAll(".modal-close").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("open"));
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("open")}));
$("renameSave").onclick=saveRename;
$("renameInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveRename()});

load();renderChats();render();loadModels();
</script>
</body>
</html>
